[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dangosimulator"
version = "0.3.0"
description = "鳴潮小團快跑桌面與批次模擬器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.0",
]

[project.scripts]
dangosim = "dangosim.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dangosim*"]

[tool.setuptools.package-data]
dangosim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
